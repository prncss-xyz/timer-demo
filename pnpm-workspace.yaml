packages:
  - .

allowBuilds:
  esbuild: true
  sharp: true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@^0.1.24
  vite-plus: ^0.1.24
  vitest: npm:@voidzero-dev/vite-plus-test@^0.1.24

overrides:
  vite: 'catalog:'
  vitest: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

patchedDependencies:
  react-server-dom-webpack: patches/react-server-dom-webpack.patch
  waku@1.0.0-beta.2: patches/waku.patch
